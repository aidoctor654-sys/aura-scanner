name: Build AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve URL
        id: url
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Echo
        run: echo "URL is ${{ steps.url.outputs.url }}"
      - name: Test heredoc
        env:
          PWA_URL: ${{ steps.url.outputs.url }}
        run: |
          echo "PWA_URL=$PWA_URL"
          cat > /tmp/test.json <<EOF
          {"url": "${PWA_URL}"}
          EOF
          cat /tmp/test.json
      - name: Build AAB
        env:
          PWA_URL: ${{ steps.url.outputs.url }}
        run: |
          cat > /tmp/payload.json <<EOF
          {
            "name": "Aura Scanner",
            "host": "${PWA_URL}",
            "packageId": "com.aura.scanner",
            "appVersion": "1.0.0.0",
            "appVersionCode": 1,
            "iconUrl": "${PWA_URL}/icons/icon-512.png",
            "webManifestUrl": "${PWA_URL}/manifest.webmanifest"
          }
          EOF
          cat /tmp/payload.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test
          path: /tmp/payload.json

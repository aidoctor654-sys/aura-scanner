name: Build Android App Bundle

# Builds AAB using Bubblewrap CLI on GitHub Actions runner.
# JDK 17 is set up automatically; bubblewrap + Android SDK are installed.
# Input: PWA hosted publicly on HTTPS (defaults to GitHub Pages URL).
# Output: aura-scanner-aab artifact + (optional) upload to Play Store internal.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build AAB with Bubblewrap
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PWA URL
        id: url
        run: |
          if [ -n "${{ secrets.PWA_HOST }}" ]; then
            URL="${{ secrets.PWA_HOST }}"
          else
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Using PWA host: $URL"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate TWA project
        run: bubblewrap init --manifest="${{ steps.url.outputs.url }}/manifest.webmanifest"

      - name: Build AAB
        run: bubblewrap build

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-scanner-aab
          path: app-release-bundle.aab
          retention-days: 30

  upload-play:
    name: Upload to Google Play (internal)
    needs: build-aab
    if: ${{ secrets.SERVICE_ACCOUNT_JSON != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: aura-scanner-aab
          path: .

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.aura.scanner
          releaseFiles: app-release-bundle.aab
          track: internal
          status: draft

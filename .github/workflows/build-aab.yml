name: Build AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build AAB via PWABuilder Cloud API
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PWA URL
        id: url
        run: |
          if [ -n "${{ secrets.PWA_HOST }}" ]; then
            URL="${{ secrets.PWA_HOST }}"
          else
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Using PWA host: $URL"

      - name: Verify PWA reachable
        run: |
          URL="${{ steps.url.outputs.url }}"
          HTTP=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$URL/" || echo 000)
          echo "PWA reachable: HTTP $HTTP"

      - name: Build AAB
        env:
          PWA_URL: ${{ steps.url.outputs.url }}
        run: |
          echo "PWA_URL=$PWA_URL"
          curl -X POST https://pwabuilder-cloudapk.azurewebsites.net/generateAppPackage \
            -H "Content-Type: application/json" \
            -o /tmp/resp.zip \
            -w "HTTP %{http_code}\n" \
            -d '{"name":"Aura Scanner","packageId":"com.aura.scanner","appVersion":"1.0.0.0","appVersionCode":1,"host":"'"$PWA_URL"'","iconUrl":"'"$PWA_URL"'/icons/icon-512.png","webManifestUrl":"'"$PWA_URL"'/manifest.webmanifest","startUrl":"/","display":"standalone","themeColor":"#0a0612","backgroundColor":"#0a0612","navigationColor":"#0a0612","launcherName":"Aura","fallbackType":"customtabs","signingMode":"none","signing":null}'
          file /tmp/resp.zip
          ls -la /tmp/resp.zip

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-scanner-aab
          path: /tmp/resp.zip
          retention-days: 30
